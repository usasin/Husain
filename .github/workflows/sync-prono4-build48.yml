name: Sync PRONO4 Build 48 into Husain

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-prono4-build48.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-build48:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Husain repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PRONO4 Build 48 source
        run: |
          git clone --depth 1 https://github.com/usasin/prono4-ios.git /tmp/prono4-build48

      - name: Copy Build 48 application code
        run: |
          set -euo pipefail
          rm -rf lib functions test
          cp -a /tmp/prono4-build48/lib ./lib
          cp -a /tmp/prono4-build48/functions ./functions
          if [ -d /tmp/prono4-build48/test ]; then
            cp -a /tmp/prono4-build48/test ./test
          fi
          cp /tmp/prono4-build48/pubspec.yaml ./pubspec.yaml
          cp /tmp/prono4-build48/pubspec.lock ./pubspec.lock
          cp /tmp/prono4-build48/firebase.json ./firebase.json
          cp /tmp/prono4-build48/firestore.rules ./firestore.rules
          cp /tmp/prono4-build48/firestore.indexes.json ./firestore.indexes.json
          for f in BUILD47_NOTES.txt BUILD48_NOTES.txt DEPLOY_PRONO4_BUILD47_BACKEND.sh; do
            if [ -f "/tmp/prono4-build48/$f" ]; then cp "/tmp/prono4-build48/$f" "./$f"; fi
          done

          # Important: keep Husain's proven iOS/Codemagic setup.
          # We intentionally do NOT replace ios/, scripts/ or codemagic.yaml.
          grep -q '^version: 2.5.3+48$' pubspec.yaml
          test -f lib/screens/settings_screen.dart

      - name: Commit Build 48 sync
        run: |
          set -euo pipefail
          git config user.name "PRONO4 Build Sync"
          git config user.email "124710758+usasin@users.noreply.github.com"
          git add lib functions test pubspec.yaml pubspec.lock firebase.json firestore.rules firestore.indexes.json BUILD47_NOTES.txt BUILD48_NOTES.txt DEPLOY_PRONO4_BUILD47_BACKEND.sh 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Build 48 already synchronized."
            exit 0
          fi
          git commit -m "PRONO4 Build 48: sync profile, settings and blocking fixes"
          git push origin HEAD:main
