name: prono4
description: PRONO4 - pronostics football en équipe de 4
publish_to: 'none'
version: 2.2.0+41


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  uuid: ^4.2.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  http: ^1.2.2
  flutter_local_notifications: ^22.0.0
  flutter_timezone: ^5.1.0
  google_mobile_ads: ^9.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  timezone: ^0.11.0
  firebase_messaging: ^16.2.0   # push mi-temps (FCM)
  firebase_storage: ^13.4.3       # images dynamiques admin via gs:// ou URL
  # ── 2026 features ─────────────────────────────────────
  image_picker: ^1.1.2          # Pick photo from gallery / camera
  image: ^4.2.0                 # Resize/compress custom avatars
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo_foreground.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#101211"
  adaptive_icon_foreground: assets/images/logo_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#101211"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false

  android_12:
    color: "#101211"
    image: assets/images/logo.png
